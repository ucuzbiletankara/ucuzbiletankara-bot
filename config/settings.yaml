# Fırsat seçme ayarları. Rakamları değiştirerek sistemin davranışını ayarlayabilirsin.

currency: try

content:
  model: claude-haiku-5-5    # içerik modeli (Haiku: ucuz; daha yüksek kalite için claude-sonnet-5-5)
  effort: medium             # low | medium | high — düşük effort Haiku'da aramaları atlatabilir
  max_searches: 3            # post başına en fazla web araması (~0,01 $/arama); fazlası Haiku'yu 100k token üstü pahalı kademeye taşır
  thinking: disabled         # disabled | adaptive — Haiku'da düşünmeyi kapatmak çıktı maliyetini düşürür

markets: [tr, ru]          # Travelpayouts veri pazarları; ikisinden gelen fiyatların en ucuzu alınır

scan:
  months_ahead: 6           # bugünden itibaren kaç ay ileriye bakılsın (erken planlama, vize süresi)
  min_days_ahead: 5         # en erken kaç gün sonraki uçuş paylaşılabilir
  max_days_ahead: 183

round_trip:
  min_nights: 2
  max_nights: 7
  # Gidiş-dönüş fiyatı, en ucuz tek yön fiyatının bu katından pahalıysa sadece gidiş gösterilir
  max_ratio_to_one_way: 2.3

scoring:
  min_discount: 0.15        # rotanın normal (medyan) fiyatından en az %15 ucuz olmalı
  full_confidence_samples: 10  # normal fiyat bu kadar fiyat örneğinden azsa indirim orantılı küçültülür
  season_bonus: 15
  holiday_bonus: 10         # resmi tatile/köprüye denk gelen tarihler
  sweet_spot_days: [21, 150] # bu aralıkta kalkan uçuşlara küçük bonus (planlamaya uygun süre)
  sweet_spot_bonus: 5
  recent_city_days: 21      # aynı şehir bu kadar gün içinde paylaşıldıysa elenir
  recent_country_days: 5    # aynı ülke bu kadar gün içinde paylaşıldıysa ceza
  recent_country_penalty: 20
  # Vize gereken ülkelerde (Türk vatandaşları için) yakın tarihli kalkışlara ceza
  visa_min_days: 30
  visa_short_notice_penalty: 15
  visa_countries: [AT, BE, CZ, DK, EE, FI, FR, DE, GR, HU, IS, IT, LV, LI, LT, LU, MT,
                   NL, NO, PL, PT, SK, SI, ES, SE, CH, HR, BG, RO, GB, IE, CY]

airlines:
  PC: Pegasus
  VF: AJet
  XQ: SunExpress
  TK: Türk Hava Yolları
  J2: AZAL
  FZ: flydubai
  W6: Wizz Air
  W4: Wizz Air Malta
  SU: Aeroflot
  QR: Qatar Airways
  TO: Transavia France
  HV: Transavia
  OS: Austrian Airlines
  LH: Lufthansa
  MS: EgyptAir
  A9: Georgian Airways

publish:
  enabled: true              # true: günlük iş akışı Instagram'a gerçekten paylaşır (kullanıcı 26 Kasım'da açtırdı)
  ig_user_id: "17841480123113951"   # @ucuzbiletankara Instagram hesap kimliği (gizli değil)

# Reklam/tanıtım bildirimi — Ticari Reklam ve Haksız Ticari Uygulamalar Yönetmeliği m.23/A (1 Ağustos 2026)
# Menfaat ilişkisi (ücret, ürün, indirim, komisyon/affiliate, davet, sponsorluk) olan her post:
#   - caption'ın İLK satırı "Tanıtım" + reklam veren adı
#   - kapakta okunur "Tanıtım · <marka>" etiketi
#   - hashtag'lerde #reklam
# Menfaat ilişkisi OLMAYAN marka anmalarında (havayolu, restoran...) etiket KULLANILMAZ.
disclosure:
  word: Tanıtım                   # "Reklam" ya da "Tanıtım" (ikisi de yönetmelikte geçerli)
  # Profildeki bilet linki Aviasales (Travelpayouts) satış ortaklığı linki → postlar bu linke yönlendiriyor
  affiliate_bio_link: true
  # Caption'ın ilk satırı: "Tanıtım · <ortaklar>: <relation_text>." (yoksa ortakların relation'ları birleşir)
  relation_text: profildeki bilet linki satış ortaklığı (komisyon) linkidir
  partners:
    - name: Aviasales
      relation: profildeki bilet linki satış ortaklığı (komisyon) linkidir
  # Airalo 27 Kasım'da çıkarıldı: BTK engeli nedeniyle Türkiye'den açılmıyor.
  # eSIM ortağı eklenince: partners'a ekle, relation_text'i "bilet ve eSIM linkleri ... linkleridir" yap,
  # esim.link_in_bio: true ve esim.closing_text'i doldur.
  # İleride yeni ortak eklenirse buraya (ör. Hepsiburada) — bildirim otomatik genişler

# Yurtdışı internet notu. Kullanıcı kuralı (26 Kasım): her postta yurtdışı internet için eSIM önerisi.
# 27 Kasım: Airalo (ve Travelpayouts'taki diğer eSIM markaları) BTK engeli nedeniyle Türkiye'den açılmıyor →
# Türkiye'den açılan bir ortak bulunana kadar linksiz, markasız öneri.
esim:
  enabled: true
  link_in_bio: false               # profilde çalışan bir eSIM ortak linki varsa true
  skip_cities: [ECN]               # KKTC: Türk hatları zaten çalışıyor, eSIM önerisi anlamsız
  tip: {title: "İnternet: eSIM", text: "Roaming yerine eSIM kullan; yola çıkmadan Türkiye'deyken al ve kur."}
  caption_line: "📶 Yurtdışı internet: yola çıkmadan eSIM'ini Türkiye'deyken al ve kur, iner inmez bağlan."
  closing_text:                    # ortak varken ör. "Yurtdışında internet: <Marka> eSIM'ini profildeki linkten al..."

