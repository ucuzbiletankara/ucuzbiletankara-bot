name: Fırsat taraması (test)

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kütüphaneleri kur
        run: pip install -r requirements.txt

      - name: Ankara'dan direkt fırsatları tara
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python -m bot.scan

      - name: Sonucu dosya olarak sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarama-sonucu
          path: data/scan_latest.json
          if-no-files-found: ignore
