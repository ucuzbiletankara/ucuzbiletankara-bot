name: Post önizleme (test)

# Tarama + içerik + fotoğraf + 10 slayt PNG. Instagram'a PAYLAŞMAZ.
# Sonuç: Actions özetinde rapor, "post-onizleme" dosyası ve "onizleme" dalı.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bot/**"
      - "config/**"
      - "templates/**"
      - ".github/workflows/post.yml"

permissions:
  contents: write

concurrency:
  group: post-onizleme
  cancel-in-progress: true

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kütüphaneleri kur
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Pixabay önbelleği (24 saat)
        uses: actions/cache@v4
        with:
          path: .cache
          key: pixabay-${{ github.run_id }}
          restore-keys: pixabay-

      - name: 1) Fırsatları tara
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: |
          set -o pipefail
          python -m bot.scan 2>&1 | tee data/scan_log.txt

      - name: 2) Postu üret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -o pipefail
          python -m bot.post 2>&1 | tee data/post_log.txt

      - name: Önizlemeyi dosya olarak sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-onizleme
          path: |
            output/post/
            data/scan_summary.md
            data/scan_latest.json
            data/scan_log.txt
            data/post_log.txt
          if-no-files-found: ignore

      - name: Önizlemeyi "onizleme" dalına yaz
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/out
          cp -r output/post/. /tmp/out/ 2>/dev/null || true
          cp data/scan_summary.md data/scan_latest.json data/scan_log.txt data/post_log.txt /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b onizleme
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Önizleme $(date -u +%Y-%m-%dT%H:%MZ) (${{ github.sha }})" || exit 0
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" onizleme
